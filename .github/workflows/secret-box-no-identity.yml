name: secret-box-no-identity
# Runs the assertNoIdentity unit suite on every PR + push to main.
# Fails CI if any future change re-introduces session_token / ip_hash /
# other identity-correlator leaks in API responses.

on:
  push:
    branches: [main]
    paths:
      - 'lib/safety.ts'
      - 'scripts/test-no-identity.mjs'
      - 'app/api/**'
  pull_request:
    paths:
      - 'lib/safety.ts'
      - 'scripts/test-no-identity.mjs'
      - 'app/api/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run no-identity unit tests
        run: node scripts/test-no-identity.mjs
