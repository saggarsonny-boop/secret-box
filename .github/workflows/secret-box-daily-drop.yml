name: secret-box-daily-drop
# Curates the day's 5-secret drop at 20:00 UTC.
# Idempotent: re-runs that day will overwrite the entry.

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/daily/curate
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENGINE_URL: ${{ secrets.ENGINE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ] || [ -z "${ENGINE_URL:-}" ]; then
            echo "::warning::CRON_SECRET or ENGINE_URL not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST "${ENGINE_URL%/}/api/daily/curate" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Length: 0"
