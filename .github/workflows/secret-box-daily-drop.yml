name: secret-box-daily-drop
# Curates the day's 5-secret drop at 20:00 UTC.
# Idempotent: re-runs that day will overwrite the entry.

on:
  workflow_dispatch:

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/daily/curate
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "https://secretbox.hive.baby/api/daily/curate" \
            -H "Authorization: Bearer ${CRON_SECRET:-public_cron_trigger_token_xyz_5566}" \
            -H "Content-Length: 0"
