name: secret-box-publish-queue
# Releases time-released secrets whose scheduled_release_at has passed.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/publish-queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENGINE_URL: ${{ secrets.ENGINE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ] || [ -z "${ENGINE_URL:-}" ]; then
            echo "::warning::CRON_SECRET or ENGINE_URL not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST "${ENGINE_URL%/}/api/publish-queue" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Length: 0"
