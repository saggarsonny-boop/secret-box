name: secret-box-publish-queue
# Releases time-released secrets whose scheduled_release_at has passed.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/publish-queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST "https://secretbox.hive.baby/api/publish-queue" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Length: 0"
