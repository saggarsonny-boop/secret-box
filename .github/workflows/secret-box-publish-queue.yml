name: secret-box-publish-queue
# Releases time-released secrets whose scheduled_release_at has passed.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/publish-queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "https://secretbox.hive.baby/api/publish-queue" \
            -H "Authorization: Bearer ${CRON_SECRET:-public_cron_trigger_token_xyz_5566}" \
            -H "Content-Length: 0"
