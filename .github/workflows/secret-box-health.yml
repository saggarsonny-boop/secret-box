name: secret-box-health
# Pings /api/health every 6 hours to verify the engine is reachable.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/health
        env:
          ENGINE_URL: ${{ secrets.ENGINE_URL }}
        run: |
          set -euo pipefail
          URL="${ENGINE_URL:-https://secretbox.hive.baby}"
          STATUS=$(curl -s -o /tmp/h.json -w "%{http_code}" "${URL%/}/api/health")
          cat /tmp/h.json
          echo
          test "$STATUS" = "200"
