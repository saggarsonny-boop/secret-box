name: secret-box-monthly-art
# Curates the previous month's 12-poster art gallery on the 1st at 12:00 UTC.
# Idempotent: re-runs that day overwrite the gallery row.

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/monthly-art/curate
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENGINE_URL: ${{ secrets.ENGINE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ] || [ -z "${ENGINE_URL:-}" ]; then
            echo "::warning::CRON_SECRET or ENGINE_URL not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST "${ENGINE_URL%/}/api/monthly-art/curate" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Length: 0"
