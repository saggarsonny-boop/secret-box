name: secret-box-monthly-art
# Curates the previous month's 12-poster art gallery on the 1st at 12:00 UTC.
# Idempotent: re-runs that day overwrite the gallery row.

on:
  workflow_dispatch:

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/monthly-art/curate
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "https://secretbox.hive.baby/api/monthly-art/curate" \
            -H "Authorization: Bearer ${CRON_SECRET:-public_cron_trigger_token_xyz_5566}" \
            -H "Content-Length: 0"
